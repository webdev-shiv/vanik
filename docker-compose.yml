version: '3.8'

services:
  # 1. PostgreSQL / Supabase Compatible Database
  postgres:
    image: postgres:16-alpine
    container_name: merchant_growth_postgres
    environment:
      POSTGRES_DB: merchant_growth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Python FastAPI AI & ML Microservice
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: merchant_growth_ai
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  # 3. Java 21 Spring Boot REST Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: merchant_growth_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/merchant_growth_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-${POSTGRES_PASSWORD:-postgrespassword}}
      - SPRING_JPA_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    restart: unless-stopped

  # 4. Next.js + TypeScript + Tailwind CSS VANIK Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: merchant_growth_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8080
      - NEXT_PUBLIC_AI_SERVICE_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped


  # 5. n8n Workflow Automation Layer
  n8n:
    image: n8nio/n8n:latest
    container_name: merchant_growth_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  pgdata:
  n8n_data:
